<footer class="site-footer">
    <div class="wrap">
        <p>&copy; {{ now.Format "2006" }} {{ site.Title }}. Small, focused WordPress plugins.</p>
        <p><a href="/privacy/">Privacy &amp; Cookie Policy</a></p>
    </div>
</footer>

<div id="sw-cookie-banner" class="cookie-banner" hidden>
    <div class="cookie-banner-inner">
        <p>We use Google Analytics to understand how the site is used. It only runs if you say yes. See our <a href="/privacy/">Privacy &amp; Cookie Policy</a>.</p>
        <div class="cookie-banner-actions">
            <button type="button" id="sw-cookie-reject" class="btn btn-secondary">Reject</button>
            <button type="button" id="sw-cookie-accept" class="btn btn-primary">Accept</button>
        </div>
    </div>
</div>
<script>
(function () {
    var KEY = 'sw_consent';
    var stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) {}
    if (stored) { return; }

    var banner = document.getElementById('sw-cookie-banner');
    if (!banner) { return; }
    banner.hidden = false;

    function decide(value) {
        try { localStorage.setItem(KEY, value); } catch (e) {}
        if (window.gtag) {
            window.gtag('consent', 'update', {
                'analytics_storage': value,
                'ad_storage': value,
                'ad_user_data': value,
                'ad_personalization': value
            });
            if (value === 'granted') {
                window.gtag('event', 'page_view');
            }
        }
        banner.hidden = true;
    }

    document.getElementById('sw-cookie-accept').addEventListener('click', function () { decide('granted'); });
    document.getElementById('sw-cookie-reject').addEventListener('click', function () { decide('denied'); });
})();
</script>
