<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="1100" height="420" fill="#ffffff"/>

  <rect x="40" y="170" width="230" height="80" rx="12" fill="#111827"/>
  <text x="155" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">WordPress</text>
  <text x="155" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db">page response</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d1d5db"/>
    </marker>
  </defs>

  <line x1="270" y1="190" x2="420" y2="90" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="230" x2="420" y2="330" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="420" y="40" width="300" height="110" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="570" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">No security headers</text>
  <text x="570" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Can be framed by other sites</text>
  <text x="570" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">Browser may MIME-sniff files</text>
  <text x="570" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">No HTTPS-only enforcement</text>

  <rect x="420" y="280" width="300" height="110" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="570" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Headers set</text>
  <text x="570" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">X-Frame-Options blocks framing</text>
  <text x="570" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">X-Content-Type-Options: nosniff</text>
  <text x="570" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">HSTS + allow-listed CSP</text>

  <line x1="720" y1="95" x2="860" y2="180" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="720" y1="335" x2="860" y2="250" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="860" y="170" width="200" height="80" rx="12" fill="#FF5513"/>
  <text x="960" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Visitor's</text>
  <text x="960" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">browser</text>
</svg>
