<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="1100" height="420" fill="#ffffff"/>

  <!-- Start: original upload -->
  <rect x="30" y="170" width="230" height="80" rx="12" fill="#111827"/>
  <text x="145" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Camera-original</text>
  <text x="145" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db">8MB JPEG upload</text>

  <!-- Top path: unoptimized -->
  <rect x="400" y="30" width="260" height="90" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="530" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Served as-is</text>
  <text x="530" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">full size, original format</text>
  <text x="530" y="99" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">no compression</text>

  <rect x="790" y="30" width="260" height="80" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="920" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Slow page load</text>
  <text x="920" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">hurts LCP score</text>

  <!-- Bottom path: optimized -->
  <rect x="400" y="300" width="260" height="100" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="530" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Resize + compress</text>
  <text x="530" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">to display size, lossy/lossless</text>
  <text x="530" y="367" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">ShortPixel, Imagify, EWWW...</text>
  <text x="530" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">then converted to WebP/AVIF</text>

  <rect x="790" y="315" width="260" height="80" rx="12" fill="#FF5513"/>
  <text x="920" y="360" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Fast page load</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d1d5db"/>
    </marker>
  </defs>

  <line x1="260" y1="195" x2="390" y2="90" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="260" y1="230" x2="390" y2="345" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="75" x2="780" y2="70" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="660" y1="355" x2="780" y2="355" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
