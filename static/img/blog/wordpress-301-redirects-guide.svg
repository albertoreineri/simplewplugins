<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <rect width="1100" height="420" fill="#ffffff"/>

  <rect x="20" y="170" width="200" height="80" rx="12" fill="#111827"/>
  <text x="120" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Old URL</text>
  <text x="120" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d1d5db">requested</text>

  <rect x="400" y="40" width="300" height="90" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="550" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Server config</text>
  <text x="550" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">.htaccess (Apache) or</text>
  <text x="550" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">nginx rewrite rule</text>

  <rect x="400" y="280" width="300" height="110" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  <text x="550" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827">Inside WordPress</text>
  <text x="550" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">core old-slug redirect</text>
  <text x="550" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">or a redirect plugin</text>
  <text x="550" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">(Redirection, Rank Math, Yoast)</text>

  <rect x="860" y="170" width="200" height="80" rx="12" fill="#FF5513"/>
  <text x="960" y="206" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">301 response</text>
  <text x="960" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">new URL loads</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d1d5db"/>
    </marker>
  </defs>

  <line x1="220" y1="195" x2="390" y2="100" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="220" y1="225" x2="390" y2="330" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="100" x2="850" y2="195" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="330" x2="850" y2="225" stroke="#d1d5db" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
